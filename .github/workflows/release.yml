name: Release

# A version tag (v1.2.3) builds, tests and publishes a signed release. The tag
# ruleset stops tags moving, and immutable releases stop files changing after.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Checked first, so a wrong tag fails before anything is published.
      - name: Tag and package version must match
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::Tag $TAG doesn't match package.json version $version."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Checksums
        working-directory: dist
        run: sha256sum aptitude-training.js aptitude-training.css > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            dist/aptitude-training.js
            dist/aptitude-training.css
            dist/SHA256SUMS
          retention-days: 7

  # The GitHub release stays a draft until npm has staged the package. Immutable
  # releases lock a version once it's published, so publishing it before a failed npm
  # step would use up the version number.
  publish:
    name: Sign and draft
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write # store the provenance
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Sign build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
          create-storage-record: false
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --generate-notes \
            release/aptitude-training.js release/aptitude-training.css release/SHA256SUMS

  npm:
    name: Stage on npm
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # trusted publishing: npm checks this workflow's identity, no token stored
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Staged: the version stays hidden until the maintainer approves it on
      # npmjs.com with two-factor sign-in. publishConfig sets public access and provenance.
      - run: npm stage publish

  release:
    name: Publish the release
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # publish the draft
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
